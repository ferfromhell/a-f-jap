[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback - status 200 without force lets functions work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


